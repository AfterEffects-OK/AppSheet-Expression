<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppSheet Expression Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg shadow-md shadow-blue-500/20">
                    <i class="fa-solid fa-code text-lg"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="font-bold text-lg tracking-tight">AppSheet Expression Builder</h1>
                        <span class="text-[10px] font-medium text-blue-400">v3.2 beta</span>
                    </div>
                    <p class="text-xs text-slate-400">テーブル構造からAppSheet全関数構文を自動生成・解説</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button id="btn-open-import" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg border border-slate-700 transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-file-import text-blue-400"></i>
                    <span>一括インポート / CSV</span>
                </button>
                <button id="btn-load-sample" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg border border-slate-700 transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i>
                    <span>サンプル</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Column: Schema & Table Setup -->
        <section class="lg:col-span-5 space-y-6">
            <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 shadow-xl">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-semibold text-sm flex items-center space-x-2 text-slate-200">
                        <i class="fa-solid fa-database text-blue-400"></i>
                        <span>1. スキーマ（テーブル構造）</span>
                    </h2>
                    <span id="table-count" class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">テーブル数: 0</span>
                </div>

                <!-- Add Table Form -->
                <div class="space-y-3">
                    <div class="flex space-x-2">
                        <input type="text" id="new-table-name" placeholder="テーブル名 (例: 注文明細)" class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
                        <button id="btn-add-table" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium rounded-lg transition flex items-center space-x-1">
                            <i class="fa-solid fa-plus"></i>
                            <span>追加</span>
                        </button>
                    </div>
                    <div>
                        <textarea id="quick-columns-input" placeholder="カンマ、タブ、または行データをそのまま貼り付け (例: ID注文	ID顧客	金額)" rows="2" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs focus:outline-none focus:border-blue-500 resize-none"></textarea>
                    </div>
                </div>

                <!-- Tables List Container -->
                <div id="tables-container" class="mt-4 space-y-3 max-h-[500px] overflow-y-auto pr-1">
                    <!-- Dynamic Tables Render Here -->
                </div>
            </div>
        </section>

        <!-- Right Column: Expression Generator & Output -->
        <section class="lg:col-span-7 space-y-6">
            <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 shadow-xl space-y-4">
                <h2 class="font-semibold text-sm flex items-center space-x-2 text-slate-200">
                    <i class="fa-solid fa-gears text-emerald-400"></i>
                    <span>2. 生成したい処理の設定</span>
                </h2>

                <!-- Function Category Selector -->
                <div>
                    <label class="block text-xs text-slate-400 mb-1">生成パターン（関数の選択）</label>
                    <select id="function-category" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs focus:outline-none focus:border-emerald-500">
                        <!-- Options injected dynamically -->
                    </select>
                </div>

                <!-- Dynamic Config Parameters Area -->
                <div id="config-params-container" class="space-y-3 pt-2 border-t border-slate-800">
                    <!-- Dynamic parameters based on selected function -->
                </div>
            </div>

            <!-- Result Output Box -->
            <div class="bg-slate-900/90 border border-blue-500/30 rounded-xl p-5 shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
                <div class="flex items-center justify-between mb-3">
                    <h3 class="font-semibold text-sm text-blue-400 flex items-center space-x-2">
                        <i class="fa-solid fa-terminal"></i>
                        <span>3. 生成された APPSHEET 式</span>
                    </h3>
                    <button id="btn-copy-result" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium rounded-lg transition flex items-center space-x-1.5 shadow-md shadow-blue-600/20">
                        <i class="fa-solid fa-copy"></i>
                        <span>クリップボードにコピー</span>
                    </button>
                </div>

                <div class="bg-slate-950 border border-slate-800 rounded-lg p-3 font-mono text-sm text-emerald-400 break-all select-all min-h-[50px] flex items-center" id="result-expression">
                    <!-- Generated expression appears here -->
                </div>

                <div class="mt-4 pt-3 border-t border-slate-800/80 space-y-2 text-xs">
                    <div class="text-slate-300 font-medium">式の動作解説</div>
                    <p id="result-explanation" class="text-slate-400 leading-relaxed"></p>
                </div>

                <div class="mt-3 pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
                    <span id="result-tip"></span>
                    <a id="help-link" href="#" target="_blank" class="text-blue-400 hover:underline flex items-center space-x-1">
                        <span>公式ドキュメントで詳細を確認</span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <!-- Import Modal -->
    <div id="import-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <h3 class="font-bold text-base text-slate-200 flex items-center space-x-2">
                <i class="fa-solid fa-file-import text-blue-400"></i>
                <span>複数スキーマ一括インポート</span>
            </h3>
            <p class="text-xs text-slate-400">
                スプレッドシートやExcel等の草案行データ（タブ区切り・カンマ区切り）をそのまま貼り付けて一括取り込みできます。
            </p>
            <textarea id="modal-paste-text" placeholder="例:&#10;ID注文	ID顧客	金額	注文日	ステータス&#10;ID顧客	顧客名	メールアドレス	会員ランク" rows="6" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-xs focus:outline-none focus:border-blue-500 font-mono"></textarea>
            
            <div class="flex justify-end space-x-2 pt-2">
                <button id="btn-cancel-import" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium rounded-lg transition">キャンセル</button>
                <button id="btn-submit-import" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium rounded-lg transition shadow-md">一括インポート実行</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-emerald-600 text-white text-xs px-4 py-2.5 rounded-lg shadow-xl transform translate-y-16 opacity-0 transition-all duration-300 z-50 flex items-center space-x-2">
        <i class="fa-solid fa-check-circle"></i>
        <span id="toast-msg">操作が完了しました</span>
    </div>

    <!-- Application Script Logic -->
    <script>
        // Data & State
        let schema = JSON.parse(localStorage.getItem('appsheet_schema')) || [
            { id: 't1', name: '注文履歴', isOpen: true, columns: [
                { name: 'ID注文', type: 'Text' }, { name: 'ID顧客', type: 'Ref' }, { name: '金額', type: 'Price' },
                { name: '注文日', type: 'Date' }, { name: 'ステータス', type: 'Text' }, { name: '作成日時', type: 'DateTime' }
            ]},
            { id: 't2', name: '顧客マスタ', isOpen: true, columns: [
                { name: 'ID顧客', type: 'Text' }, { name: '顧客名', type: 'Text' }, { name: 'メールアドレス', type: 'Email' }
            ]}
        ];

        // DOM Elements
        const tablesContainer = document.getElementById('tables-container');
        const tableCount = document.getElementById('table-count');
        const newTableNameInput = document.getElementById('new-table-name');
        const quickColumnsInput = document.getElementById('quick-columns-input');
        const btnAddTable = document.getElementById('btn-add-table');
        const functionCategory = document.getElementById('function-category');
        const configParamsContainer = document.getElementById('config-params-container');
        const resultExpression = document.getElementById('result-expression');
        const resultExplanation = document.getElementById('result-explanation');
        const resultTip = document.getElementById('result-tip');
        const helpLink = document.getElementById('help-link');
        const btnCopyResult = document.getElementById('btn-copy-result');
        const importModal = document.getElementById('import-modal');
        const btnOpenImport = document.getElementById('btn-open-import');
        const btnCancelImport = document.getElementById('btn-cancel-import');
        const btnSubmitImport = document.getElementById('btn-submit-import');
        const modalPasteText = document.getElementById('modal-paste-text');
        const btnLoadSample = document.getElementById('btn-load-sample');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');

        function showToast(msg) {
            toastMsg.textContent = msg;
            toast.classList.remove('translate-y-16', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-16', 'opacity-0');
            }, 2500);
        }

        function saveSchema() {
            localStorage.setItem('appsheet_schema', JSON.stringify(schema));
        }

        function autoDetectType(colName) {
            if (colName.includes('日時') || colName.includes('タイムスタンプ')) return 'DateTime';
            if (colName.includes('日') || colName.includes('日')) return 'Date';
            if (colName.includes('金額') || colName.includes('単価') || colName.includes('価格')) return 'Price';
            if (colName.includes('数') || colName.includes('数量')) return 'Number';
            if (colName.includes('メール')) return 'Email';
            if (colName.startsWith('ID')) return 'Text';
            return 'Text';
        }

        function renderSchema() {
            tablesContainer.innerHTML = '';
            tableCount.textContent = `テーブル数: ${schema.length}`;

            schema.forEach((tbl, tIdx) => {
                const div = document.createElement('div');
                div.className = 'bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs space-y-2';
                
                let colsHtml = tbl.columns.map((col, cIdx) => `
                    <span class="inline-flex items-center bg-slate-900 border border-slate-800 rounded px-2 py-0.5 space-x-1">
                        <span class="text-slate-200 font-medium">${col.name}</span>
                        <span class="text-[10px] text-slate-500">${col.type}</span>
                        <button onclick="removeColumn(${tIdx}, ${cIdx})" class="text-slate-500 hover:text-rose-400 ml-1"><i class="fa-solid fa-xmark"></i></button>
                    </span>
                `).join('');

                div.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="font-semibold text-slate-200">${tbl.name} (${tbl.columns.length} Cols)</span>
                        <div class="space-x-1">
                            <button onclick="addColumnPrompt(${tIdx})" class="text-blue-400 hover:underline">＋列追加</button>
                            <button onclick="removeTable(${tIdx})" class="text-slate-500 hover:text-rose-400 ml-2"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-1.5 pt-1">
                        ${colsHtml}
                    </div>
                `;
                tablesContainer.appendChild(div);
            });
            updateDropdowns();
            generateExpression();
        }

        window.removeTable = function(tIdx) {
            schema.splice(tIdx, 1);
            saveSchema();
            renderSchema();
        }

        window.removeColumn = function(tIdx, cIdx) {
            schema[tIdx].columns.splice(cIdx, 1);
            saveSchema();
            renderSchema();
        }

        window.addColumnPrompt = function(tIdx) {
            const colName = prompt('追加する列名を入力してください:');
            if (!colName) return;
            schema[tIdx].columns.push({ name: colName.trim(), type: autoDetectType(colName) });
            saveSchema();
            renderSchema();
        }

        btnAddIdClick: btnAddTable.addEventListener('click', () => {
            const name = newTableNameInput.value.trim();
            if (!name) {
                alert('テーブル名を入力してください。');
                return;
            }
            const rawCols = quickColumnsInput.value.trim();
            let columns = [{ name: 'ID' + name, type: 'Text' }];
            if (rawCols) {
                columns = rawCols.split(/[\t,]+/).map(c => c.trim()).filter(Boolean).map(c => ({ name: c, type: autoDetectType(c) }));
            }
            schema.push({ id: 't_' + Date.now(), name, isOpen: true, columns });
            newTableNameInput.value = '';
            quickColumnsInput.value = '';
            saveSchema();
            renderSchema();
            showToast('テーブルを追加しました');
        });

        // Function Templates definitions
        const functionsList = [
            { id: 'LOOKUP', label: 'LOOKUP（他テーブルから1項目取得）', syntax: 'LOOKUP(lookup-value, table-name, lookup-column, return-column)', exp: '指定テーブルを検索し、一致するレコードの指定列の値を返します。' },
            { id: 'SELECT', label: 'SELECT（条件に一致するリスト抽出）', syntax: 'SELECT(table-name[column-name], condition)', exp: '条件を満たす行の特定カラムの値をリスト形式で抽出します。' },
            { id: 'SUM', label: 'SUM（合計）', syntax: 'SUM(SELECT(...))', exp: '抽出された数値リストの合計値を算出します。' },
            { id: 'COUNT', label: 'COUNT（件数）', syntax: 'COUNT(SELECT(...))', exp: '抽出されたリストの要素数（件数）をカウントします。' },
            { id: 'CONCATENATE', label: 'CONCATENATE（文字列の結合）', syntax: 'CONCATENATE(text1, text2, ...)', exp: '複数の文字列や列の値を結合します。' }
        ];

        function updateDropdowns() {
            functionCategory.innerHTML = functionsList.map(f => `<option value="${f.id}">${f.label}</option>`).join('');
            renderConfigParams();
        }

        function renderConfigParams() {
            const selectedId = functionCategory.value;
            configParamsContainer.innerHTML = `
                <div class="text-xs text-slate-400">
                    設定パラメータ: <span class="text-emerald-400 font-mono">${selectedId}</span> 関数用の設定項目です。
                </div>
            `;
            generateExpression();
        }

        function generateExpression() {
            const fnId = functionCategory.value;
            let expr = '';
            let explanation = '';

            if (fnId === 'LOOKUP') {
                const tbl = schema[0] ? schema[0].name : 'Table';
                const col = schema[0] && schema[0].columns[0] ? schema[0].columns[0].name : 'ID';
                expr = `LOOKUP([_THISROW].[${col}], "${tbl}", "${col}", "${col}")`;
                explanation = `「${tbl}」テーブルを検索し、${col}が現在行のリストと一致するレコードの値を取得します。`;
            } else if (fnId === 'SELECT') {
                const tbl = schema[0] ? schema[0].name : 'Table';
                const col = schema[0] && schema[0].columns[0] ? schema[0].columns[0].name : 'ID';
                expr = `SELECT(${tbl}[${col}], [ステータス] = "有効")`;
                explanation = `「${tbl}」テーブルから条件に一致する「${col}」のリストを抽出します。`;
            } else if (fnId === 'SUM') {
                expr = `SUM(SELECT(注文履歴[金額], [ステータス] = "完了"))`;
                explanation = `完了した注文の金額を合計します。`;
            } else if (fnId === 'COUNT') {
                expr = `COUNT(SELECT(注文履歴[ID注文], [顧客ID] = [_THISROW].[ID顧客]))`;
                explanation = `顧客ごとの注文件数をカウントします。`;
            } else {
                expr = `CONCATENATE([名前], " 様")`;
                explanation = `文字列を結合して表示用テキストを生成します。`;
            }

            resultExpression.textContent = expr;
            resultExplanation.textContent = explanation;
            resultTip.textContent = 'AppSheet公式構文に準拠しています';
            helpLink.href = 'https://support.google.com/appsheet/answer/10107471?hl=ja';
        }

        functionCategory.addEventListener('change', renderConfigParams);

        // Copy Clipboard
        btnCopyResult.addEventListener('click', () => {
            navigator.clipboard.writeText(resultExpression.textContent);
            showToast('式をクリップボードにコピーしました！');
        });

        // Modal Controls
        btnOpenImport.addEventListener('click', () => importModal.classList.remove('hidden'));
        btnCancelImport.addEventListener('click', () => importModal.classList.add('hidden'));

        // Spreadsheet Draft Import Logic
        btnSubmitImport.addEventListener('click', () => {
            const text = modalPasteText.value.trim();
            if (!text) {
                alert('インポートするテキストを入力してください。');
                return;
            }
            const lines = text.split(/[\r\n]+/);
            let importedCount = 0;

            lines.forEach((line, idx) => {
                const trimmedLine = line.trim();
                if (!trimmedLine) return;
                const rawCols = trimmedLine
                    .split(/[\t,]+/)
                    .map(c => c.trim().replace(/^["']|["']$/g, ''))
                    .filter(Boolean);

                if (rawCols.length === 0) return;

                let firstVal = rawCols[0];
                let tblName = firstVal.replace(/^ID/, '').trim();
                if (!tblName) {
                    tblName = 'テーブル_' + (schema.length + 1);
                }

                const columns = rawCols.map(c => ({ name: c, type: autoDetectType(c) }));
                schema.push({
                    id: 'tbl_' + Date.now() + '_' + idx,
                    name: tblName,
                    isOpen: true,
                    columns: columns
                });
                importedCount++;
            });

            if (importedCount === 0) {
                alert('有効なスキーマ行が見つかりませんでした。');
                return;
            }

            saveSchema();
            renderSchema();
            importModal.classList.add('hidden');
            modalPasteText.value = '';
            showToast(`${importedCount}件のテーブルを一括インポートしました！`);
        });

        // Sample loader
        btnLoadSample.addEventListener('click', () => {
            schema = [
                { id: 's1', name: '売上履歴', isOpen: true, columns: [
                    { name: 'ID売上', type: 'Text' }, { name: 'ID商品', type: 'Ref' }, { name: '数量', type: 'Number' }, { name: '合計金額', type: 'Price' }, { name: '販売日時', type: 'DateTime' }
                ]},
                { id: 's2', name: '商品マスタ', isOpen: true, columns: [
                    { name: 'ID商品', type: 'Text' }, { name: '商品名', type: 'Text' }, { name: '単価', type: 'Price' }
                ]}
            ];
            saveSchema();
            renderSchema();
            showToast('サンプルデータを読み込みました');
        });

        // Initial render
        renderSchema();
    </script>
</body>
</html>
